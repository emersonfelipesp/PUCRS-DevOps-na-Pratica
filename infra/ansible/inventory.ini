; Inventário dos hosts que executam a aplicação.
; Em um ambiente real cada host corresponde a uma máquina virtual provisionada
; pelo Terraform; aqui a conexão local permite validar o playbook sem depender
; de infraestrutura externa.

[homologacao]
localhost ansible_connection=local

[homologacao:vars]
app_porta=8000
app_nivel_de_log=INFO
