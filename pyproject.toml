[project]
name = "inventario-rede"
version = "1.2.0"
description = "API de inventário de equipamentos de rede — projeto da disciplina DevOps na Prática"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
patch = ["subprocess"]
omit = ["tests/*"]

[tool.uv]
managed = false
