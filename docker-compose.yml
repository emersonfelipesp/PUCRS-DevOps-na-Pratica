name: inventario-rede

services:
  api:
    image: ${APP_IMAGE:-ghcr.io/emersonfelipesp/pucrs-devops-na-pratica:latest}
    container_name: inventario-api
    build:
      context: .
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEED_DEVICES: ${SEED_DEVICES:-true}
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - inventario

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: inventario-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - inventario

  grafana:
    image: grafana/grafana:11.4.0
    container_name: inventario-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - inventario

volumes:
  prometheus-data:
  grafana-data:

networks:
  inventario:
    driver: bridge
